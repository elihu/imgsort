[tool.poetry]
name = "imgsort"
version = "1.1.0"
description = "Sort and organize photo and video galleries based on embedded metadata"
authors = ["elihu"]
readme = "README.md"
license = "Apache-2.0"
keywords = ["photos", "videos", "exif", "metadata", "organizer"]

[tool.poetry.scripts]
imgsort = "imgsort.main:app"

[tool.poetry.dependencies]
python  = "^3.10"
typer   = {extras = ["all"], version = "^0.24.0"}
pillow  = "^12.0.0"
hachoir = "^3.3.0"
piexif  = "^1.1.3"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
