[project]
name = "imgsort"
version = "1.2.0"
description = "Sort and organize photo and video galleries based on embedded metadata"
authors = [{ name = "elihu" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["photos", "videos", "exif", "metadata", "organizer"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "pillow>=13.0.0",
    "hachoir>=3.4.0",
    "piexif>=1.1.3",
]

[project.scripts]
imgsort = "imgsort.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
